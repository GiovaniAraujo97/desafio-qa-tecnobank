name: Automated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automated-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project and discover BDD steps
        run: npm run validate:ci

  selenium:
    name: Selenium + Cucumber
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        run: npm test
        env:
          HEADLESS: "true"

      - name: Upload UI report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-evidence
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  api:
    name: Newman API collection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postman collection with Newman
        run: npm run test:api

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            reports/newman-results.xml
          if-no-files-found: ignore
          retention-days: 7

  api-mock:
    name: Newman API collection with local mock
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postman collection against local mock
        run: npm run test:api:mock

      - name: Upload mock API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-mock-test-results
          path: reports/newman-mock-results.xml
          if-no-files-found: ignore
          retention-days: 7
